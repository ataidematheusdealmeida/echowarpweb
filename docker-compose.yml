services:
  echowarp-web:
    build:
      context: .
      args:
        ECHOWARP_VERSION: "0.9.2"
    environment:
      ECHOWARP_SERVER: "${ECHOWARP_SERVER:-}"
      ECHOWARP_PORT: "${ECHOWARP_PORT:-4415}"
      ECHOWARP_PASSWORD: "${ECHOWARP_PASSWORD:-}"
      ECHOWARP_DEVICE_NAME: "${ECHOWARP_DEVICE_NAME:-EchoWarpWeb}"
      ECHOWARP_LOG_LEVEL: "${ECHOWARP_LOG_LEVEL:-info}"
      ECHOWARP_EXTRA_ARGS: "${ECHOWARP_EXTRA_ARGS:-}"
      ECHOWARP_MAX_RECONNECT: "${ECHOWARP_MAX_RECONNECT:-5}"
      ECHOWARP_CLIENT_AUTO_RECONNECT: "${ECHOWARP_CLIENT_AUTO_RECONNECT:-false}"
      ECHOWARP_CLIENT_AUTO_RECONNECT_ATTEMPTS: "${ECHOWARP_CLIENT_AUTO_RECONNECT_ATTEMPTS:-0}"
      ECHOWARP_SERVER_NAME: "${ECHOWARP_SERVER_NAME:-EchoWarpWeb}"
      ECHOWARP_SERVER_DISCOVERY: "${ECHOWARP_SERVER_DISCOVERY:-true}"
      ECHOWARP_MAX_CLIENTS: "${ECHOWARP_MAX_CLIENTS:-1}"
      ECHOWARP_AUDIO_BUFFER_FRAMES: "${ECHOWARP_AUDIO_BUFFER_FRAMES:-5}"
      ECHOWARP_RATE_LIMIT: "${ECHOWARP_RATE_LIMIT:-5}"
      ECHOWARP_MAX_AUTH_FAILURES: "${ECHOWARP_MAX_AUTH_FAILURES:-5}"
      ECHOWARP_RECORD: "${ECHOWARP_RECORD:-}"
      ECHOWARP_RECORD_DIR: "${ECHOWARP_RECORD_DIR:-}"
      ECHOWARP_TLS_CERT: "${ECHOWARP_TLS_CERT:-}"
      ECHOWARP_TLS_KEY: "${ECHOWARP_TLS_KEY:-}"
      ECHOWARP_BAN_FILE: "${ECHOWARP_BAN_FILE:-}"
      ECHOWARP_HWID_REQUIRED: "${ECHOWARP_HWID_REQUIRED:-false}"
      ECHOWARP_SERVER_MUTED: "${ECHOWARP_SERVER_MUTED:-false}"
      WEB_HOST: "${WEB_HOST:-}"
      WEB_PORT: "${WEB_PORT:-3008}"
      WEB_AUTH_USER: "${WEB_AUTH_USER:-admin@example.com}"
      WEB_AUTH_PASSWORD: "${WEB_AUTH_PASSWORD:?Set WEB_AUTH_PASSWORD in .env}"
      WEB_SESSION_TTL_SECONDS: "${WEB_SESSION_TTL_SECONDS:-43200}"
      PULSE_RATE: "${PULSE_RATE:-48000}"
      PULSE_CHANNELS: "${PULSE_CHANNELS:-2}"
      HLS_TIME: "${HLS_TIME:-0.5}"
      HLS_LIST_SIZE: "${HLS_LIST_SIZE:-30}"
      AUDIO_BITRATE: "${AUDIO_BITRATE:-128k}"
      RECORDING_RETENTION_HOURS: "${RECORDING_RETENTION_HOURS:-168}"
      AUDIO_FILTER: "${AUDIO_FILTER-dynaudnorm=f=75:g=3:p=0.95}"
      SILENCE_RESTART_SECONDS: "${SILENCE_RESTART_SECONDS:-45}"
      SILENCE_RESTART_COOLDOWN_SECONDS: "${SILENCE_RESTART_COOLDOWN_SECONDS:-120}"
      SILENCE_DBFS_THRESHOLD: "${SILENCE_DBFS_THRESHOLD:--88}"
      SILENCE_PEAK_THRESHOLD: "${SILENCE_PEAK_THRESHOLD:-0.0005}"
    network_mode: host
    volumes:
      - echowarp-web-data:/home/echowarp/.config/echowarp-web
    restart: unless-stopped

volumes:
  echowarp-web-data:
